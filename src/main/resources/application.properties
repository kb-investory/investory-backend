datasource.host=${MYSQL_HOST:localhost}
datasource.port=${MYSQL_PORT:3306}
datasource.name=${MYSQL_DB}
datasource.username=${MYSQL_USER}
datasource.password=${MYSQL_PASSWORD}
datasource.url=jdbc:mysql://${datasource.host}:${datasource.port}/${datasource.name}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
datasource.driver-class-name=com.mysql.cj.jdbc.Driver

codef.demo.client-id=${CODEF_CLIENT_ID}
codef.demo.client-secret=${CODEF_CLIENT_SECRET}
codef.demo.public-key=${CODEF_PUBLIC_KEY}