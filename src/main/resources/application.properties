# ===============================
# App
# ===============================
app.uri.prefix=${APP_URI_PREFIX:/}
app.frontend.default-redirect-uri=${FRONTEND_DEFAULT_REDIRECT_URI}
app.frontend.allowed-redirect-origins=${FRONTEND_ALLOWED_REDIRECT_ORIGINS}

# ===============================
# Database
# ===============================
datasource.host=${MYSQL_HOST:localhost}
datasource.port=${MYSQL_PORT:3306}
datasource.name=${MYSQL_DB}
datasource.username=${MYSQL_USER}
datasource.password=${MYSQL_PASSWORD}
datasource.url=jdbc:mysql://${datasource.host}:${datasource.port}/${datasource.name}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Broker mock server
# ===============================
broker.mock-server.base-url=${BROKER_MOCK_SERVER_URL:http://mock.investory.kr:8080}

# ===============================
# CODEF API
# ===============================
codef.demo.client-id=${CODEF_CLIENT_ID}
codef.demo.client-secret=${CODEF_CLIENT_SECRET}
codef.demo.public-key=${CODEF_PUBLIC_KEY}
# SANDBOX: 실계좌 없이 고정 응답으로 파이프라인 검증. 실계좌 확보되면 DEMO로 전환
codef.service-type=${CODEF_SERVICE_TYPE:SANDBOX}

# ===============================
# Kakao OAuth
# ===============================
oauth.kakao.client-id=${OAUTH_KAKAO_CLIENT_ID}
oauth.kakao.client-secret=${OAUTH_KAKAO_CLIENT_SECRET}
oauth.kakao.authorize-uri=https://kauth.kakao.com/oauth/authorize
oauth.kakao.redirect-uri=${OAUTH_KAKAO_REDIRECT_URI}
oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# ===============================
# Naver OAuth
# ===============================
oauth.naver.client-id=${OAUTH_NAVER_CLIENT_ID}
oauth.naver.client-secret=${OAUTH_NAVER_CLIENT_SECRET}
oauth.naver.authorize-uri=https://nid.naver.com/oauth2.0/authorize
oauth.naver.redirect-uri=${OAUTH_NAVER_REDIRECT_URI}
oauth.naver.token-uri=https://nid.naver.com/oauth2.0/token
oauth.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

# ===============================
# Google OAuth
# ===============================
oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET}
oauth.google.authorize-uri=https://accounts.google.com/o/oauth2/v2/auth
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI}
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.access-token-expire-seconds=${JWT_ACCESS_TOKEN_EXPIRE_SECONDS:1800}
jwt.refresh-token-expire-seconds=${JWT_REFRESH_TOKEN_EXPIRE_SECONDS:1209600}