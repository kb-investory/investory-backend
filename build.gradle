plugins {
    id 'java'
    id 'war'
}

group 'com.investory'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.16'
    jacksonVersion = '2.17.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
dependencies {
    implementation(platform("org.springframework:spring-framework-bom:${springVersion}"))
    implementation("org.springframework:spring-context")
    implementation("org.springframework:spring-webmvc")
    implementation("org.springframework:spring-jdbc")
    implementation("org.springframework:spring-tx")
    testImplementation("org.springframework:spring-test")
    compileOnly("javax.servlet:javax.servlet-api:4.0.1")
    testImplementation("javax.servlet:javax.servlet-api:4.0.1")
    implementation("javax.annotation:javax.annotation-api:1.3.2")

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")

    // security
    implementation(platform("org.springframework.security:spring-security-bom:${springSecurityVersion}"))
    implementation("org.springframework.security:spring-security-web")
    implementation("org.springframework.security:spring-security-config")
    testImplementation("org.springframework.security:spring-security-test") // 추가: 시큐리티 테스트용

    // lombok
    compileOnly("org.projectlombok:lombok:1.18.34")
    annotationProcessor("org.projectlombok:lombok:1.18.34")
    testCompileOnly("org.projectlombok:lombok:1.18.34")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.34")

    // database
    implementation("org.mybatis:mybatis:3.5.16")
    implementation("org.mybatis:mybatis-spring:2.1.2")
    implementation("com.zaxxer:HikariCP:5.1.0")
    runtimeOnly("com.mysql:mysql-connector-j:8.4.0")

    // json
    implementation(platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}"))
    implementation("com.fasterxml.jackson.core:jackson-databind")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")

    // logging
    implementation("org.slf4j:slf4j-api:2.0.17")
    implementation("ch.qos.logback:logback-classic:1.5.18")

    // validator
    implementation("javax.validation:validation-api:2.0.1.Final")
    implementation("org.hibernate.validator:hibernate-validator:6.2.5.Final")
    implementation("org.glassfish:javax.el:3.0.0") // 추가: 없으면 런타임에 ExpressionFactory 에러

    // codef: 증권사 계좌 연동(계정등록 등) 연동용 공식 SDK. 비밀번호 RSA 암호화 등을 직접 구현하지 않기 위해 사용
    implementation("io.codef.api:easycodef-java:1.0.6")

    // swagger: 순수 Spring MVC(non-Boot) 환경 호환을 위해 springdoc 대신 springfox 사용
    implementation("io.springfox:springfox-swagger2:3.0.0")
    implementation("io.springfox:springfox-swagger-ui:3.0.0")
}

test {
    useJUnitPlatform()
}