name: Main CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build WAR
        run: ./gradlew build --build-cache

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: read
      id-token: write

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/463680495848/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: deploy-bot@kbinvestory.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via docker compose on GCP VM (IAP + OS Login)
        run: |
          gcloud compute ssh investory-api-main-server \
            --project=kbinvestory \
            --zone=asia-northeast3-c \
            --tunnel-through-iap \
            --command='
              set -e
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
              cd "${{ secrets.DEPLOY_PATH }}"
              docker compose pull
              docker compose up -d --remove-orphans
              docker image prune -f

              echo "Waiting for /health to return 200..."
              for i in $(seq 1 30); do
                if curl -sf -o /dev/null "http://localhost:8080/health"; then
                  echo "Healthy after ${i} attempt(s)"
                  exit 0
                fi
                sleep 2
              done
              echo "Container did not become healthy in time" >&2
              exit 1
            '
